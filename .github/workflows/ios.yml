name: iOS build
on:
  push:
    branches:
    - main
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: true
    - name: Diagnose environment
      run: |
        {
          echo "=== runner ==="
          sw_vers || true
          echo "uname: $(uname -a)"
          echo "=== toolchain ==="
          echo "cmake: $(cmake --version 2>&1 | head -1)"
          echo "python3: $(python3 --version 2>&1 | head -1)"
          echo "xcode-select: $(xcode-select -p 2>&1)"
          echo "=== SDKs ==="
          xcrun --sdk iphoneos --show-sdk-path 2>&1 || echo "  (iphoneos SDK lookup FAILED)"
          echo "=== git ==="
          git --version
        } 2>&1 | tee diagnose.log
    - name: Sync dependencies
      run: |
        set -o pipefail
        ./utils/git-sync-deps 2>&1 | tee sync.log
        echo "=== third_party after sync ==="
        for d in third_party/*/; do
          echo "  $d -> $(find "$d" -type f 2>/dev/null | wc -l) files"
        done
        echo "glslang ParseHelper.cpp: $(test -f third_party/glslang/glslang/MachineIndependent/ParseHelper.cpp && echo present || echo MISSING)"
        echo "glslang GlslangToSpv.cpp: $(test -f third_party/glslang/SPIRV/GlslangToSpv.cpp && echo present || echo MISSING)"
    - name: Apply glslang swizzle null-deref fixes
      run: |
        set -e
        python3 patches/patch_glslang_swizzle.py third_party/glslang
        echo "--- verifying ParseHelper.cpp (lValueErrorCheck) ---"
        grep -n -B1 -A3 "aggrNode == nullptr" third_party/glslang/glslang/MachineIndependent/ParseHelper.cpp || echo "PROBLEM: ParseHelper guard missing"
        echo "--- verifying GlslangToSpv.cpp (convertSwizzle) ---"
        grep -n "convertSwizzleSafe" third_party/glslang/SPIRV/GlslangToSpv.cpp || echo "PROBLEM: convertSwizzleSafe missing"
        echo "--- unguarded call sites must be gone ---"
        if grep -n "convertSwizzle(\*node->getRight()->getAsAggregate()" third_party/glslang/SPIRV/GlslangToSpv.cpp; then
          echo "PROBLEM: unguarded visitBinary site still present"
          exit 1
        fi
        if grep -n "convertSwizzle(\*node.getAsBinaryNode()->getRight()->getAsAggregate()" third_party/glslang/SPIRV/GlslangToSpv.cpp; then
          echo "PROBLEM: unguarded createInvertedSwizzle site still present"
          exit 1
        fi
        echo "all guards verified"
    - name: Build shaderc
      id: build_shaderc
      run: |
        set -o pipefail
        {
          sed -i'' -e 's/iOS/Darwin/g' third_party/spirv-tools/tools/CMakeLists.txt
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CROSSCOMPILING=true \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_C_FLAGS="-arch arm64 -miphoneos-version-min=12.0 -fvisibility=hidden" \
            -DCMAKE_CXX_FLAGS="-arch arm64 -miphoneos-version-min=12.0 -fvisibility=hidden -fvisibility-inlines-hidden" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-exported_symbol,_shaderc_*" \
            -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_TESTS=ON
          cmake --build build --config RelWithDebInfo -- -j8
        } 2>&1 | tee build.log
    - name: Inspect dylib
      if: success()
      run: |
        set -e
        DYLIB=$(ls build/libshaderc/*.dylib | head -1)
        echo "dylib: $DYLIB"
        echo "size: $(stat -f%z "$DYLIB") bytes"
        echo "arch: $(lipo -archs "$DYLIB" 2>/dev/null || echo unknown)"
        EXPF=$(mktemp)
        nm -gU "$DYLIB" > "$EXPF" 2>/dev/null || true
        C=$(grep -c "_shaderc_" "$EXPF" || true)
        G=$(grep -c "glslang" "$EXPF" || true)
        S=$(grep -ci "spvtools" "$EXPF" || true)
        echo "=== shaderc C API exported (need >= 40): ${C:-0}"
        echo "=== glslang exported (MUST be 0): ${G:-0}"
        echo "=== spirv-tools exported (MUST be 0): ${S:-0}"
        echo "=== total exported: $(wc -l < "$EXPF" | tr -d ' ')"
        if ! grep -q "shaderc_compile_options_set_max_id_bound" "$EXPF"; then
          echo "FATAL: max_id_bound missing (required by LWJGL 3.4.x)"
          exit 1
        fi
        if [ "${G:-0}" -ne 0 ] || [ "${S:-0}" -ne 0 ] || [ "${C:-0}" -lt 40 ]; then
          echo "FATAL: symbol export policy violated."
          echo "  glslang / spirv-tools symbols must NOT be exported: they collide"
          echo "  with MobileGL's own copies at dyld bind time (ODR -> layout mismatch)."
          exit 1
        fi
        echo "symbol export policy OK (only _shaderc_* visible to dyld)"
        echo "=== install name ==="
        otool -D "$DYLIB" 2>/dev/null || true
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          diagnose.log
          sync.log
          build.log
    - name: Upload libshaderc
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: libshaderc
        path: build/libshaderc/*.dylib
    - name: Publish dylib to dist branch
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        DYLIB=$(ls build/libshaderc/*.dylib | head -1)
        cp "$DYLIB" ./libshaderc-patched.dylib
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f ./libshaderc-patched.dylib
        if git diff --cached --quiet; then
          echo "no change, skip commit"
        else
          git commit -m "chore: publish patched libshaderc (glslang swizzle null fixes)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/yitenchen123/shaderc.git" HEAD:dist
          echo "published to dist branch"
        fi
